  deleteSelection();
}

/* ---- Apple Pencil: Strich-Erkennung ---- */
function reversals(pts, axis, thr) {
  let dir = 0, ext = pts[0][axis], n = 0;
  for (const p of pts) {
    const v = p[axis];
    if (!dir) { if (Math.abs(v - ext) > thr) { dir = Math.sign(v - ext); ext = v; } continue; }
    if ((v - ext) * dir > 0) ext = v;
    else if (Math.abs(v - ext) > thr) { n++; dir = -dir; ext = v; }
  }
  return n;
}
function penStroke(pts) {
  const d = curD(), k = view().k;
  const M = measured(d), all = [...M.values()];
  $('#ov').innerHTML = '';
  if (pts.length < 3) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, len = 0;
  pts.forEach((p, i) => { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x); y1 = Math.max(y1, p.y); if (i) len += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y); });
  const bw = x1 - x0, bh = y1 - y0, big = Math.max(bw, bh);
  const inside = (p, n, m = 8 / k) => Math.abs(p.x - n.x) <= n.w / 2 + m && Math.abs(p.y - n.y) <= n.h / 2 + m;
  const nodeAt = p => { for (let i = all.length - 1; i >= 0; i--) if (inside(p, all[i])) return all[i]; return null; };
  const first = pts[0], last = pts[pts.length - 1];

  // 1) Durchkritzeln → löschen
  const thr = 7 / k;
  const rev = Math.max(reversals(pts, 'x', thr), reversals(pts, 'y', thr));
  if (rev >= 3 && len > 2.2 * big) {
    let best = null, bestN = 0;
    all.forEach(n => { const c = pts.filter(p => inside(p, n, 4 / k)).length; if (c > bestN) { bestN = c; best = n; } });
    if (best && bestN >= pts.length * 0.3) { deleteItem('node', best.id); return; }
    let be = null, bd = 24 / k;
    d.edges.forEach(e => {
      const a = M.get(e.from), b = M.get(e.to); if (!a || !b) return;
      const g = edgeGeom(a, b, e, d, all);
      g.segs.forEach(sg => { for (let t = 0; t <= 1.0001; t += 0.05) { const q = bez(sg, t); pts.forEach(p => { const dd = Math.hypot(p.x - q.x, p.y - q.y); if (dd < bd) { bd = dd; be = e; } }); } });
    });
    if (be) { deleteItem('edge', be.id); return; }
    return;
  }
  const A = nodeAt(first), B = nodeAt(last);
  // 2) Linie von Schritt zu Schritt → Verbindung
  if (A && B && A.id !== B.id) {
    const e = addEdge(d, A.id, B.id);
    if (e) { ui.sel = { kind: 'edge', id: e.id }; relayout(d); changed(); refreshSteps(); renderCanvas(); }
    return;
  }
  // 3) Linie von Schritt ins Leere → neuer Schritt am Ende
  if (A && !B && len > 50 / k) {
    const nn = addNode('process', '', { from: A.id, at: last });
    changed(); refreshSteps(); renderCanvas(); inlineEdit('node', nn.id);
    return;
  }
  if (A || B) return;
  // 4) Geschlossene Form im Leeren → neuer Schritt (Rechteck, Oval, Raute)
  const closed = Math.hypot(first.x - last.x, first.y - last.y) < 0.35 * big + 12 / k;
  if (!closed || bw < 36 / k || bh < 22 / k) {
    if (len > 60 / k) toast('Nicht erkannt – zeichne ein Rechteck, Oval oder eine Raute.', { ms: 2200 });
    return;
  }
  const hd = Math.hypot(bw, bh) / 2;
  const corners = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]];
  const cd = corners.reduce((s, [cx, cy]) => s + Math.min(...pts.map(p => Math.hypot(p.x - cx, p.y - cy))), 0) / 4 / hd;
  // Flächenverhältnis Form/Umriss: Rechteck ≈ 1, Oval ≈ 0,79, Raute ≈ 0,5
  let area = 0;
  pts.forEach((p, i) => { const q = pts[(i + 1) % pts.length]; area += p.x * q.y - q.x * p.y; });
  const fill = Math.abs(area) / 2 / (bw * bh);
  let type = (cd < 0.15 || fill > 0.87) ? 'process' : fill < 0.64 ? 'decision' : 'oval';
  if (type === 'oval') type = d.nodes.some(n => n.type === 'start') ? 'end' : 'start';
  const nn = addNode(type, '', { at: { x: (x0 + x1) / 2, y: (y0 + y1) / 2 } });
  changed(); refreshSteps(); renderCanvas();
  toast(`${NODE_TYPES[type].label} erkannt – jetzt Text schreiben`, { ms: 1800 });
  inlineEdit('node', nn.id);
}

function initCanvas() {
  const svg = $('#canvas');
  renderCanvas();
  requestAnimationFrame(() => { const v = view(); if (!v.init) fitView(); else applyView(); });

  svg.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    const isPen = e.pointerType === 'pen', isTouch = e.pointerType === 'touch';
    if (isPen) { ui.lastPen = Date.now(); if (!ui.penSeen) { ui.penSeen = true; ui.coarse = true; updatePenUI(); } }
    // Handballen-Erkennung: Finger ignorieren, solange bzw. kurz nachdem der Stift aufliegt
    if (isTouch && ([...pointers.values()].some(p => p.type === 'pen') || Date.now() - ui.lastPen < 350)) { e.preventDefault(); return; }
    if ((isTouch || isPen) && !ui.coarse) { ui.coarse = true; updatePenUI(); }
    if (document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
    e.preventDefault();
    // Neue Geste beginnt: Reste früherer Gesten verwerfen (Ursache für "Wischen zoomt")
    if (e.isPrimary) { pointers.clear(); drag = null; }
    try { svg.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, type: e.pointerType });
    clearTimeout(penTimer);
    const v = view();
    if (pointers.size >= 2) {
      const touches = [...pointers.values()].filter(p => p.type === 'touch');
      if (touches.length === 2) {
        const [a, b] = touches;
        $('#ov').innerHTML = ''; ui.lifted = null;
        drag = { mode: 'pinch', d0: Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), k0: v.k, tx0: v.tx, ty0: v.ty, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      }
      return;
    }
    const t = e.target;
    const xN = t.closest('[data-del-node]'), xE = t.closest('[data-del-edge]');
    if (xN || xE) {
      drag = null; pointers.delete(e.pointerId);
      deleteItem(xN ? 'node' : 'edge', xN ? xN.dataset.delNode : xE.dataset.delEdge);
      return;
    }
    const h = t.closest('[data-handle]'), n = t.closest('[data-node]'), ed = t.closest('[data-edge]');
    const w = toWorld(e);
    const key = h ? 'h' : n ? 'n:' + n.dataset.node : ed ? 'e:' + ed.dataset.edge : 'bg';
    // Doppeltippen nur nach einem echten Tippen (ohne Bewegung) werten
    const dbl = key === lastTap.key && Date.now() - lastTap.t < 400;
    if (dbl) lastTap = { key: '', t: 0 };
    const d = curD();
    const prevSel = ui.sel ? { ...ui.sel } : null;
    const pid = e.pointerId;
    if (h) {
      drag = { mode: 'connect', pid, key, from: h.dataset.handle, sx: e.clientX, sy: e.clientY };
      ui.sel = { kind: 'node', id: h.dataset.handle };
    } else if (isPen && penMode() === 'draw' && !dbl) {
      // Apple Pencil (Zeichnen): Tippen = auswählen/Text, Strich = Geste, Halten = verschieben
      drag = { mode: 'pen', pid, key, pts: [w], sx: e.clientX, sy: e.clientY, node: n ? n.dataset.node : null, edge: ed ? ed.dataset.edge : null, prevSel, stroke: false };
      if (n) {
        const nodeId = n.dataset.node;
        penTimer = setTimeout(() => {
          if (!drag || drag.mode !== 'pen' || drag.stroke) return;
          const node = curD().nodes.find(x => x.id === nodeId); if (!node) return;
          const ww = drag.pts[drag.pts.length - 1];
          drag = { mode: 'move', pid, key: '', id: nodeId, dx: ww.x - node.x, dy: ww.y - node.y, sx: drag.sx, sy: drag.sy, moved: false };
          ui.sel = { kind: 'node', id: nodeId }; ui.lifted = nodeId;
          renderCanvas(); scrollStepIntoView();
        }, 380);
      }
      return;
    } else if (n) {
      const node = d.nodes.find(x => x.id === n.dataset.node);
      ui.sel = { kind: 'node', id: node.id };
      if (dbl) { drag = null; pointers.clear(); renderCanvas(); inlineEdit('node', node.id); return; }
      drag = { mode: 'move', pid, key, id: node.id, dx: w.x - node.x, dy: w.y - node.y, sx: e.clientX, sy: e.clientY, moved: false };
    } else if (ed) {
      ui.sel = { kind: 'edge', id: ed.dataset.edge };
      drag = { mode: 'tap', pid, key, sx: e.clientX, sy: e.clientY };
      if (dbl) { pointers.clear(); renderCanvas(); inlineEdit('edge', ed.dataset.edge); return; }
    } else {
      if (dbl) {
        drag = null; pointers.clear();
        const node = addNode(d.nodes.length ? 'process' : 'start', '', { at: w });
        changed(); renderCanvas(); refreshSteps(); inlineEdit('node', node.id); return;
      }
      ui.sel = null;
      drag = { mode: 'pan', pid, key, sx: e.clientX, sy: e.clientY, tx: v.tx, ty: v.ty };
      svg.classList.add('panning');
    }
    renderCanvas();
    scrollStepIntoView();
  });

  svg.addEventListener('pointermove', e => {
    if (pointers.has(e.pointerId)) { const p = pointers.get(e.pointerId); p.x = e.clientX; p.y = e.clientY; }
    if (!drag) return;
    const v = view(), d = curD();
    if (drag.mode === 'pinch') {
      const touches = [...pointers.values()].filter(p => p.type === 'touch');
      if (touches.length !== 2) return;
      const [a, b] = touches;
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      const r = svg.getBoundingClientRect();
      const k2 = clamp(drag.k0 * dist / drag.d0, 0.2, 2.5);
      const cx = drag.mx - r.left, cy = drag.my - r.top;
      v.tx = cx - (cx - drag.tx0) * (k2 / drag.k0) + ((a.x + b.x) / 2 - drag.mx);
      v.ty = cy - (cy - drag.ty0) * (k2 / drag.k0) + ((a.y + b.y) / 2 - drag.my);
      v.k = k2; applyView(); return;
    }
    if (e.pointerId !== drag.pid) return;
    if (drag.mode === 'pan') { v.tx = drag.tx + e.clientX - drag.sx; v.ty = drag.ty + e.clientY - drag.sy; applyView(); return; }
    if (drag.mode === 'pen') {
      const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
      (evs.length ? evs : [e]).forEach(ev => drag.pts.push(toWorld(ev)));
      if (!drag.stroke && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 6) { drag.stroke = true; clearTimeout(penTimer); }
      if (drag.stroke) drawInk(drag.pts);
      return;
    }
    const w = toWorld(e);
    if (drag.mode === 'move') {
      if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.moved = true;
      const node = d.nodes.find(x => x.id === drag.id); if (!node) return;
      node.x = Math.round((w.x - drag.dx) / 2) * 2; node.y = Math.round((w.y - drag.dy) / 2) * 2;
      renderCanvas();
    } else if (drag.mode === 'connect') {
      const from = measured(d).get(drag.from); if (!from) return;
      const TB = d.direction !== 'LR';
      const sx = TB ? from.x : from.x + from.w / 2, sy = TB ? from.y + from.h / 2 : from.y;
      $('#ov').innerHTML = `<path d="M${r1(sx)},${r1(sy)} L${r1(w.x)},${r1(w.y)}" stroke="${ACCENT}" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#kw-arr-sel)" pointer-events="none"/>`;
    }
  });

  const end = e => {
    pointers.delete(e.pointerId);
    svg.classList.remove('panning');
    if (!drag) return;
    if (drag.mode === 'pinch') { if (pointers.size < 2) drag = null; return; }
    if (e.pointerId !== drag.pid) return;
    clearTimeout(penTimer);
    const d = curD();
    const g = drag; drag = null;
    const cancelled = e.type === 'pointercancel' || e.type === 'lostpointercapture';
    const movedPx = Math.hypot(e.clientX - (g.sx ?? e.clientX), e.clientY - (g.sy ?? e.clientY));
    const wasTap = !cancelled && (g.mode === 'pen' ? !g.stroke : g.mode === 'move' ? !g.moved : movedPx < 6);
    lastTap = wasTap && g.key ? { key: g.key, t: Date.now() } : { key: '', t: 0 };
    if (g.mode === 'pen') {
      if (cancelled) { $('#ov').innerHTML = ''; return; }
      if (!g.stroke) { // Tippen mit dem Stift
        if (g.node) {
          if (g.prevSel && g.prevSel.kind === 'node' && g.prevSel.id === g.node) { renderCanvas(); inlineEdit('node', g.node); return; }
          ui.sel = { kind: 'node', id: g.node };
        } else if (g.edge) {
          if (g.prevSel && g.prevSel.kind === 'edge' && g.prevSel.id === g.edge) { renderCanvas(); inlineEdit('edge', g.edge); return; }
          ui.sel = { kind: 'edge', id: g.edge };
        } else ui.sel = null;
        renderCanvas(); scrollStepIntoView(); return;
      }
      g.pts.push(toWorld(e));
      penStroke(g.pts);
      return;
    }
    if (g.mode === 'move') {
      ui.lifted = null;
      if (g.moved) {
        if (d.layout === 'auto') { d.layout = 'manual'; d.edges.forEach(x => delete x.via); }
        changed();
      }
      renderCanvas();
    } else if (g.mode === 'connect') {
      $('#ov').innerHTML = '';
      if (cancelled) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const tn = el && el.closest && el.closest('#canvas [data-node]');
      if (tn && tn.dataset.node !== g.from) {
        const ed = addEdge(d, g.from, tn.dataset.node);
        if (ed) { ui.sel = { kind: 'edge', id: ed.id }; relayout(d); changed(); refreshSteps(); renderCanvas(); }
      } else if (!tn && el && el.closest && el.closest('#canvas') && Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > 30) {
        const w = toWorld(e);
        const fromNode = d.nodes.find(n => n.id === g.from);
        const nn = addNode('process', '', { from: fromNode ? fromNode.id : null, at: w });
        changed(); refreshSteps(); renderCanvas(); inlineEdit('node', nn.id);
      }
    }
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('lostpointercapture', e => { if (drag && drag.pid === e.pointerId && drag.mode !== 'connect' && drag.mode !== 'pen') end(e); else pointers.delete(e.pointerId); });
  svg.addEventListener('contextmenu', e => e.preventDefault());

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey || Math.abs(e.deltaY) >= Math.abs(e.deltaX)) zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)));
    else { const v = view(); v.tx -= e.deltaX; v.ty -= e.deltaY; applyView(); }
  }, { passive: false });
}

function scrollStepIntoView() {
  const s = ui.sel; if (!s) return;
  const el = s.kind === 'node' ? $(`#steps [data-step="${CSS.escape(s.id)}"]`) : $(`#steps [data-edge-row="${CSS.escape(s.id)}"]`);
  const box = $('#steps');
  if (el && box && box.scrollHeight > box.clientHeight + 4) {
    const top = el.offsetTop - box.offsetTop;
    if (top < box.scrollTop || top > box.scrollTop + box.clientHeight - 60) box.scrollTo({ top: top - 20, behavior: 'smooth' });
  }
}

function inlineEdit(kind, id) {
  const d = curD(), wrap = $('#canvas-wrap'); if (!wrap) return;
  $$('.inline-edit', wrap).forEach(x => x.remove());
  const v = view(); const M = measured(d);
  let item, cx, cy, w, h;
  if (kind === 'node') {
    item = d.nodes.find(n => n.id === id); if (!item) return;
    const m = M.get(id);
    cx = m.x; cy = m.y; w = Math.max(150, (m.type === 'decision' ? m.w * 0.72 : m.w - 12) * v.k); h = Math.max(40, Math.min(m.h - 10, 90) * v.k);
  } else {
    item = d.edges.find(e => e.id === id); if (!item) return;
    const a = M.get(item.from), b = M.get(item.to);
    const p = edgeGeom(a, b, item, d, [...M.values()]).label;
    cx = p.x; cy = p.y; w = 150; h = 36;
  }
  const ta = document.createElement('textarea');
  ta.className = 'inline-edit';
  ta.value = item.label || '';
  ta.placeholder = kind === 'node' ? 'Bezeichnung' : 'Beschriftung';
  if (ui.penSeen || ui.coarse) { w = Math.max(w, 230); h = Math.max(h, 64); ta.style.fontSize = '16px'; }
  const sx = cx * v.k + v.tx, sy = cy * v.k + v.ty;
  Object.assign(ta.style, { left: `${sx - w / 2}px`, top: `${sy - h / 2}px`, width: `${w}px`, height: `${h}px` });
  wrap.appendChild(ta);
  ta.focus(); ta.select();
  let done = false;
  const finish = save => {
    if (done) return; done = true;
    if (save && ta.value.trim() !== str(item.label)) { item.label = ta.value.trim(); relayout(d); changed(); }
    ta.remove(); renderCanvas(); refreshSteps();
  };
  ta.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); finish(true); }
    if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  });
  ta.addEventListener('blur', () => finish(true));
  ta.addEventListener('pointerdown', e => e.stopPropagation());
}

/* ---- Mermaid ---- */
function toMermaid(d) {
  const id = new Map(d.nodes.map((n, i) => [n.id, 'n' + (i + 1)]));
  const q = s => '"' + str(s).replace(/"/g, '#quot;').replace(/\n/g, ' ') + '"';
  const shape = n => {
    const l = q(str(n.label).trim() || NODE_TYPES[n.type].label);
    switch (n.type) {
      case 'start': case 'end': return `([${l}])`;
      case 'decision': return `{${l}}`;
      case 'io': return `[/${l}/]`;
      case 'data': return `[(${l})]`;
      default: return `[${l}]`;
    }
  };
  const lines = [`flowchart ${d.direction === 'LR' ? 'LR' : 'TD'}`];
  d.nodes.forEach(n => lines.push(`  ${id.get(n.id)}${shape(n)}`));
  d.edges.forEach(e => { if (id.has(e.from) && id.has(e.to)) lines.push(`  ${id.get(e.from)} -->${str(e.label).trim() ? `|${q(e.label.trim())}|` : ''} ${id.get(e.to)}`); });
  return lines.join('\n');
}

/* =====================================================================
   Markdown & Prompt
   ===================================================================== */
function mdBlock(t) { return str(t).trim(); }
function conceptMarkdown(c) {
  const L = [];
  const m = c.meta;
  L.push(`# ${m.name.trim() || 'Unbenanntes Konzept'}`);
  if (m.subtitle.trim()) L.push(`> ${m.subtitle.trim().replace(/\n/g, '\n> ')}`);
  const meta = [['Version', m.version], ['Status', lookup(STATUS, m.status)], ['Autor/in', m.author], ['Datum', fmtDate(m.date)], ['Projekt / Kunde', m.project]].filter(x => str(x[1]).trim());
  if (meta.length) L.push(meta.map(([k, v]) => `**${k}:** ${v}`).join(' · '));

  const g = c.goal;
  if (g.problem.trim() || g.goal.trim() || g.successCriteria.length || g.outOfScope.trim()) {
    L.push('## Ausgangslage & Ziel');
    if (g.problem.trim()) L.push(`### Ausgangslage\n${mdBlock(g.problem)}`);
    if (g.goal.trim()) L.push(`### Ziel\n${mdBlock(g.goal)}`);
    const sc = g.successCriteria.filter(x => x.text.trim());
    if (sc.length) L.push(`### Erfolgskriterien\n${sc.map(x => `- ${x.text.trim()}`).join('\n')}`);
    if (g.outOfScope.trim()) L.push(`### Nicht im Umfang\n${mdBlock(g.outOfScope)}`);
  }
  const a = c.audience;
  const roles = a.roles.filter(r => r.name.trim() || r.description.trim());
  if (a.description.trim() || roles.length) {
    L.push('## Zielgruppe & Rollen');
    if (a.description.trim()) L.push(mdBlock(a.description));
    if (roles.length) L.push(roles.map(r => `- **${r.name.trim() || 'Rolle'}**${r.description.trim() ? ` – ${r.description.trim()}` : ''}${r.permissions.trim() ? ` (Rechte: ${r.permissions.trim()})` : ''}`).join('\n'));
  }
  const feats = c.features.filter(f => f.title.trim() || f.description.trim());
  if (feats.length) {
    L.push('## Key-Funktionen (MoSCoW)');
    PRIO.forEach(([k, label]) => {
      const fs = feats.filter(f => (f.priority || 'must') === k);
      if (!fs.length) return;
      L.push(`### ${label}\n${fs.map((f, i) => `${i + 1}. **${f.title.trim() || 'Funktion'}**${f.description.trim() ? ` – ${f.description.trim().replace(/\n+/g, ' ')}` : ''}${f.roles.trim() ? ` _(Rollen: ${f.roles.trim()})_` : ''}`).join('\n')}`);
    });
  }
  const ds = c.diagrams.filter(d => d.nodes.length);
  if (ds.length) {
    L.push('## Ablauf');
    ds.forEach(d => {
      L.push(`### ${d.name || 'Diagramm'}${d.description.trim() ? `\n${d.description.trim()}` : ''}\n\`\`\`mermaid\n${toMermaid(d)}\n\`\`\``);
    });
  }
  const t = c.tech;
  const dos = t.dataObjects.filter(x => x.name.trim() || x.fields.trim());
  if (t.platform.trim() || t.stack.trim() || dos.length || t.integrations.trim()) {
    L.push('## Daten & Technik');
    const kv = [];
    if (t.platform.trim()) kv.push(`- **Plattform:** ${t.platform.trim()}`);
    if (t.stack.trim()) kv.push(`- **Tech-Stack:** ${t.stack.trim()}`);
    if (kv.length) L.push(kv.join('\n'));
    if (dos.length) L.push(`### Datenmodell\n${dos.map(o => `**${o.name.trim() || 'Objekt'}**${o.description.trim() ? ` – ${o.description.trim()}` : ''}\n${o.fields.split(/\n|;/).map(f => f.trim()).filter(Boolean).map(f => `- ${f}`).join('\n')}`).join('\n\n')}`);
    if (t.integrations.trim()) L.push(`### Schnittstellen & Integrationen\n${mdBlock(t.integrations)}`);
  }
  const o = c.open;
  const qs = o.questions.filter(x => x.text.trim()), rs = o.risks.filter(x => x.text.trim());
  if (o.assumptions.trim() || qs.length || rs.length) {
    L.push('## Offene Punkte & Risiken');
    if (o.assumptions.trim()) L.push(`### Annahmen\n${mdBlock(o.assumptions)}`);
    if (qs.length) L.push(`### Offene Fragen\n${qs.map(x => `- [${x.status === 'geklaert' ? 'x' : ' '}] ${x.text.trim().replace(/\n+/g, ' ')}${x.owner.trim() ? ` (verantwortlich: ${x.owner.trim()})` : ''}${x.status === 'inklaerung' ? ' – in Klärung' : ''}`).join('\n')}`);
    if (rs.length) L.push(`### Risiken\n${rs.map(x => `- **${x.text.trim().replace(/\n+/g, ' ')}** (Wahrscheinlichkeit: ${lookup(LEVEL, x.probability)}, Auswirkung: ${lookup(LEVEL, x.impact)})${x.mitigation.trim() ? ` → Maßnahme: ${x.mitigation.trim().replace(/\n+/g, ' ')}` : ''}`).join('\n')}`);
  }
  return L.join('\n\n');
}

function buildPrompt() {
  const p = C.prompt, t = TARGETS[p.target] || TARGETS.free;
  const name = C.meta.name.trim() || 'die Anwendung';
  const reqs = [
    'Benutzeroberfläche auf Deutsch, klar strukturiert und modern; auch auf Tablet und Smartphone bedienbar.',
    'Alle **Must-have**-Funktionen vollständig umsetzen, Should-have so weit sinnvoll, Could-have höchstens vorbereiten. Won\'t-have nicht umsetzen.',
    'Den beschriebenen Ablauf und die Rollen genau abbilden.',
    'Realistische Beispieldaten mitliefern, damit die Anwendung sofort testbar ist.',
    'Leere Zustände, Eingabefehler und Sonderfälle sinnvoll behandeln.',
    ...t.reqs,
  ];
  const parts = [
    `# Auftrag: „${name}“ umsetzen`,
    'Du bist ein erfahrener Software-Entwickler mit gutem Gespür für UX. Setze die unten beschriebene Software auf Basis des folgenden Konzepts um.',
    `## Zielplattform\n${t.text}${C.tech.platform.trim() && p.target === 'free' ? `\nIm Konzept genannt: ${C.tech.platform.trim()}` : ''}`,
    '---',
    conceptMarkdown(C),

  ];

  return parts.join('\n\n');
}

/* =====================================================================
   PDF (Druckansicht)
   ===================================================================== */
function rich(text) {
  text = str(text).trim(); if (!text) return '';
  return text.split(/\n\s*\n/).map(block => {
    const lines = block.split('\n');
    if (lines.every(l => /^\s*[-•*]\s+/.test(l))) return `<ul>${lines.map(l => `<li>${esc(l.replace(/^\s*[-•*]\s+/, ''))}</li>`).join('')}</ul>`;
    return `<p>${lines.map(esc).join('<br>')}</p>`;
  }).join('');
}
function printSections() {

  }
  const t = c.tech, dos = t.dataObjects.filter(x => x.name.trim() || x.fields.trim());
  if (t.platform.trim() || t.stack.trim() || dos.length || t.integrations.trim()) {
    const stack = t.stack.split(/[,;\n]/).map(s => s.trim()).filter(Boolean);
    out.tech = { title: 'Daten & Technik', html:
      ((t.platform.trim() || stack.length) ? `<dl class="p-kv">${t.platform.trim() ? `<dt>Plattform</dt><dd>${esc(t.platform)}</dd>` : ''}${stack.length ? `<dt>Tech-Stack</dt><dd><div class="p-chips">${stack.map(s => `<span class="p-chip">${esc(s)}</span>`).join('')}</div></dd>` : ''}</dl>` : '') +
      (dos.length ? `<h3>Datenmodell</h3><table class="p-tab"><thead><tr><th>Datenobjekt</th><th>Zweck</th><th>Felder</th></tr></thead><tbody>${dos.map(o => `<tr><td class="ft">${esc(o.name)}</td><td>${esc(o.description)}</td><td>${o.fields.split(/\n|;/).map(f => f.trim()).filter(Boolean).map(esc).join('<br>')}</td></tr>`).join('')}</tbody></table>` : '') +
      (t.integrations.trim() ? `<h3>Schnittstellen & Integrationen</h3>${rich(t.integrations)}` : '') };
  }
  const o = c.open, qs = o.questions.filter(x => x.text.trim()), rs = o.risks.filter(x => x.text.trim());
  if (o.assumptions.trim() || qs.length || rs.length) {
    out.open = { title: 'Offene Punkte & Risiken', html:
      (o.assumptions.trim() ? `<h3>Annahmen</h3>${rich(o.assumptions)}` : '') +
      (qs.length ? `<h3>Offene Fragen</h3><table class="p-tab"><thead><tr><th>Nr.</th><th>Frage</th><th>Verantwortlich</th><th>Status</th></tr></thead><tbody>${qs.map((x, i) => `<tr><td class="nr">${i + 1}</td><td>${esc(x.text).replace(/\n/g, '<br>')}</td><td>${esc(x.owner)}</td><td><span class="p-badge ${esc(x.status)}">${esc(lookup(QSTATUS, x.status))}</span></td></tr>`).join('')}</tbody></table>` : '') +
      (rs.length ? `<h3>Risiken</h3><table class="p-tab"><thead><tr><th>Risiko</th><th>Wahrsch.</th><th>Auswirkung</th><th>Maßnahme</th></tr></thead><tbody>${rs.map(x => `<tr><td>${esc(x.text).replace(/\n/g, '<br>')}</td><td><span class="p-badge ${esc(x.probability)}">${esc(lookup(LEVEL, x.probability))}</span></td><td><span class="p-badge ${esc(x.impact)}">${esc(lookup(LEVEL, x.impact))}</span></td><td>${esc(x.mitigation).replace(/\n/g, '<br>')}</td></tr>`).join('')}</tbody></table>` : '') };
  }
  return out;
}

function buildPrint() {
  const o = ui.pdf, m = C.meta, all = printSections();
  const secs = ['goal', 'audience', 'features', 'flow', 'tech', 'open'].filter(k => o[k] && all[k]).map(k => ({ key: k, ...all[k] }));
  const name = m.name.trim() || 'Unbenanntes Konzept';
  let html = '';
  if (o.cover) {
    const meta = [['Version', m.version], ['Status', lookup(STATUS, m.status)], ['Datum', fmtDate(m.date)], ['Autor/in', m.author], ['Projekt / Kunde', m.project]].filter(x => str(x[1]).trim());
    html += `<section class="p-cover">
      <div class="p-brandline"><span class="p-kicker">Softwarekonzept</span>${m.confidentiality ? `<span class="p-conf">${esc(lookup(CONF, m.confidentiality))}</span>` : ''}</div>
      <h1>${esc(name)}</h1>
      ${m.subtitle.trim() ? `<p class="p-sub">${esc(m.subtitle).replace(/\n/g, '<br>')}</p>` : ''}
      ${C.goal.goal.trim() ? `<div class="p-goalbox"><div class="p-lbl">Ziel</div>${rich(C.goal.goal)}</div>` : ''}
      ${secs.length > 1 ? `<div class="p-toc"><div class="p-lbl">Inhalt</div><ol>${secs.map(s => `<li>${esc(s.title)}</li>`).join('')}</ol></div>` : ''}
      <dl class="p-meta">${meta.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
    </section>`;
  }
  secs.forEach((s, i) => {
    html += `<section class="p-sec ${s.diag && o.diagPage && (i > 0 || o.cover) ? 'p-break' : ''}"><h2><span class="n">${i + 1}</span>${esc(s.title)}</h2>${s.html}</section>`;
  });
  if (!secs.length && !o.cover) html = '<p>Keine Inhalte für das PDF ausgewählt.</p>';
  $('#print-root').innerHTML = html;
  const cssStr = s => '"' + str(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ') + '"';
  let st = $('#print-page-style');
  if (!st) { st = document.createElement('style'); st.id = 'print-page-style'; document.head.appendChild(st); }
  const foot = `${name}${m.version ? ' · Version ' + m.version : ''}${m.confidentiality ? ' · ' + lookup(CONF, m.confidentiality) : ''}`;
  st.textContent = `@page{size:A4;margin:16mm 16mm 17mm;
    @bottom-left{content:${cssStr(foot)};font:8pt ${SVG_FONT};color:#8a90a0}
    @bottom-right{content:"Seite " counter(page) " von " counter(pages);font:8pt ${SVG_FONT};color:#8a90a0}}
    ${o.cover ? '@page:first{@bottom-left{content:none}@bottom-right{content:none}}' : ''}`;
  const prevTitle = document.title;
  document.title = `${slug(name)}_konzept_v${str(m.version || '1').replace(/[^\w.-]/g, '')}`;
  return () => { document.title = prevTitle; };
}

/* =====================================================================
   Datei-Export / -Import
   ===================================================================== */
function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function fileBase(c = C) { return `${slug(c.meta.name)}_v${str(c.meta.version || '0').replace(/[^\w.-]/g, '')}`; }
function exportConcept(c = C) {
  const data = { app: 'Konzeptwerk', schema: SCHEMA, exportedAt: nowISO(), concept: c };
  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `${fileBase(c)}_${todayStr()}.konzept.json`);
  toast(`„${c.meta.name.trim() || 'Konzept'}“ exportiert`);
}
async function importFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast('Die Datei ist kein gültiges JSON.', { type: 'error' }); return; }
  const raw = data && data.concept ? data.concept : data;
  if (!raw || typeof raw !== 'object' || (!raw.meta && !raw.diagrams && !raw.features)) { toast('Die Datei enthält kein Konzeptwerk-Konzept.', { type: 'error' }); return; }
  const c = normalize(raw);
  const finish = (asCopy) => {
    if (asCopy) { c.id = uid('k'); c.meta.name = (c.meta.name || 'Konzept') + ' (Import)'; }
    store.concepts[c.id] = c; switchTo(c.id); saveNow();
    toast(`„${c.meta.name.trim() || 'Konzept'}“ importiert`);
  };
  if (store.concepts[c.id]) {
    const ex = store.concepts[c.id];
    openModal('Konzept existiert bereits', `<p style="margin:0">Das Konzept <b>„${esc(ex.meta.name || 'Unbenannt')}“</b> ist in diesem Browser schon vorhanden (zuletzt geändert ${esc(fmtDateTime(ex.updatedAt))}).<br><br>Die importierte Datei ist vom ${esc(fmtDateTime(c.updatedAt))}. Was möchtest du tun?</p>`,
      `<button class="btn" data-act="modal-close">Abbrechen</button><button class="btn" id="imp-copy">Als Kopie importieren</button><button class="btn primary" id="imp-replace">Vorhandenes ersetzen</button>`);
    $('#imp-copy').onclick = () => { closeModal(); finish(true); };
    $('#imp-replace').onclick = () => { closeModal(); finish(false); };
  } else finish(false);
}
function isBlank(c) {
  if (!c) return false;
  return !c.meta.name.trim() && !c.meta.subtitle.trim() && !c.goal.goal.trim() && !c.goal.problem.trim() && !c.features.length &&
    !c.audience.roles.length && !c.audience.description.trim() && !c.tech.dataObjects.length && !c.tech.platform.trim() &&
    !c.open.questions.length && !c.open.risks.length && c.diagrams.every(d => !d.nodes.length);
}
function switchTo(id) {
  if (!store.concepts[id]) return;
  if (C && C.id !== id && isBlank(C)) delete store.concepts[C.id]; // leeres, unberührtes Konzept nicht liegen lassen
  store.currentId = id; C = store.concepts[id];
  ui.di = 0; ui.sel = null;
  saveSoon(); renderAll(); histReset();
}

async function copyText(t, msg = 'In die Zwischenablage kopiert') {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (_) { /* ignore */ } ta.remove();
  }
  toast(msg);
}

const ACTIONS = {
  nav(el) {
    ui.section = el.dataset.sec; closeModal();
    setHash(ui.section);
    renderNav(); renderMain();
  },
  'modal-close': closeModal,
  library: openLibrary,
  undo, redo,
  import() { closeModal(); $('#file-input').value = ''; $('#file-input').click(); },
  export() { exportConcept(); },
  pdf: openPdfDialog,
  'pdf-go'() {
    $$('[data-pdf]').forEach(cb => { if (!cb.disabled) ui.pdf[cb.dataset.pdf] = cb.checked; });
    closeModal();
    const restore = buildPrint();
    setTimeout(() => { window.print(); setTimeout(restore, 500); }, 120);
  },
  'load-example'() {
    const c = exampleConcept();
    store.concepts[c.id] = c; closeModal(); switchTo(c.id); saveNow();
    toast('Beispielkonzept geladen – schau dir besonders den Ablauf an.');
  },
  'concept-new'() {
    const c = newConcept(); store.concepts[c.id] = c; closeModal();
    ui.section = 'overview'; switchTo(c.id); saveNow();
    setTimeout(() => { const i = $('[data-bind="meta.name"]'); i && i.focus(); }, 50);
  },
  'concept-open'(el) { closeModal(); switchTo(el.dataset.id); },
  'concept-dup'(el) {
    const c = clone(store.concepts[el.dataset.id]); c.id = uid('k'); c.meta.name = (c.meta.name || 'Konzept') + ' (Kopie)'; c.createdAt = c.updatedAt = nowISO();
    store.concepts[c.id] = c; saveNow(); openLibrary(); toast('Konzept dupliziert');
  },
  'concept-export'(el) { exportConcept(store.concepts[el.dataset.id]); },
  'concept-del'(el) {
    const id = el.dataset.id, bak = store.concepts[id];
    delete store.concepts[id];
    if (id === C.id) {
      const rest = Object.values(store.concepts).sort((a, b) => str(b.updatedAt).localeCompare(str(a.updatedAt)));
      if (rest.length) switchTo(rest[0].id); else { const c = newConcept(); store.concepts[c.id] = c; switchTo(c.id); }
    }
    saveNow(); openLibrary();
    toast(`„${bak.meta.name || 'Unbenannt'}“ gelöscht`, { action: 'Rückgängig', fn: () => { store.concepts[bak.id] = bak; saveNow(); if ($('#modal').open) openLibrary(); } });
  },

  /* Listen */
  'list-add'(el) {
    const path = el.dataset.path, cfg = LISTS[path];
    const it = { id: uid('i') }; cfg.fields.forEach(f => { it[f.key] = f.def || ''; });
    getPath(C, path).push(it); changed(); renderMain(false);
    const box = $(`[data-item="${CSS.escape(it.id)}"]`);
    if (box) { const inp = $('input,textarea', box); inp && inp.focus(); box.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  },
  'list-del'(el) {
    const arr = getPath(C, el.dataset.path), i = +el.dataset.i;
    arr.splice(i, 1); changed(); renderMain(false);
    toast('Eintrag gelöscht', { action: 'Rückgängig', fn: undo });
  },
  'list-move'(el) {
    const arr = getPath(C, el.dataset.path), i = +el.dataset.i, j = i + +el.dataset.dir;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]]; changed(); renderMain(false);
  },

  /* Prompt */
  'copy-prompt'() { copyText(buildPrompt(), 'Prompt kopiert – jetzt in Claude einfügen'); },
  'download-prompt'() { downloadBlob(new Blob([buildPrompt()], { type: 'text/markdown' }), `${fileBase()}_prompt.md`); },
  'copy-md'() { copyText(conceptMarkdown(C), 'Konzept als Markdown kopiert'); },

  /* Diagramme */
  'diagram-select'(el) { ui.di = +el.dataset.i; ui.sel = null; renderMain(false); },
  'diagram-add'() {
    C.diagrams.push(newDiagram(`Ablauf ${C.diagrams.length + 1}`)); ui.di = C.diagrams.length - 1; ui.sel = null;
    changed(); renderMain(false);
    setTimeout(() => { const i = $(`[data-bind="diagrams.${ui.di}.name"]`); i && (i.focus(), i.select()); }, 30);
  },
  'diagram-del'() {
    const d = curD();
    if (C.diagrams.length === 1) { d.nodes = []; d.edges = []; d.layout = 'auto'; }
    else { C.diagrams.splice(ui.di, 1); ui.di = Math.max(0, ui.di - 1); }
    ui.sel = null; changed(); renderMain(false);
    toast(`Diagramm „${d.name}“ gelöscht`, { action: 'Rückgängig', fn: undo });
  },
  'diagram-dir'(el) {
    const d = curD(); if (d.direction === el.dataset.dir) return;
    d.direction = el.dataset.dir; d.layout = 'auto'; autoLayout(d); changed(); renderMain(false); requestAnimationFrame(() => fitView());
  },
  'diagram-autolayout'() { const d = curD(); d.layout = 'auto'; autoLayout(d); changed(); renderCanvas(); fitView(); },
  'diagram-export-svg'() {
    const d = curD(); if (!d.nodes.length) return toast('Das Diagramm ist noch leer.');
    downloadBlob(new Blob([diagramSVG(d).svg], { type: 'image/svg+xml' }), `${fileBase()}_${slug(d.name)}.svg`);
  },
  async 'diagram-export-png'() {
    const d = curD(); if (!d.nodes.length) return toast('Das Diagramm ist noch leer.');
    const { svg, w, h } = diagramSVG(d);
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    try { await img.decode(); } catch (e) { return toast('PNG-Export nicht möglich – bitte SVG nutzen.', { type: 'error' }); }
    const scale = 2.5, cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => b ? downloadBlob(b, `${fileBase()}_${slug(d.name)}.png`) : toast('PNG-Export fehlgeschlagen', { type: 'error' }), 'image/png');
  },
  'diagram-copy-mermaid'() { copyText(toMermaid(curD()), 'Mermaid-Code kopiert'); },
  zoom(el) { const r = $('#canvas').getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, +el.dataset.f); },
  'zoom-fit'() { fitView(); },
  'pen-mode'(el) {
    store.prefs = store.prefs || {}; store.prefs.penMode = el.dataset.mode; saveNow();
    $$('[data-act=pen-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === el.dataset.mode));
    toast(el.dataset.mode === 'draw' ? 'Stift zeichnet: Formen, Linien und Durchkritzeln werden erkannt' : 'Stift schiebt: ziehen verschiebt Schritte, wie mit dem Finger', { ms: 2600 });
  },
  gestures() {
    const row = (a, b) => `<tr><td style="padding:7px 10px 7px 0;font-weight:650;vertical-align:top;width:40%">${a}</td><td style="padding:7px 0;color:var(--ink2)">${b}</td></tr>`;
    openModal('Bedienung der Zeichenfläche', `
      <h3 style="margin:0 0 4px;font-size:14px">${icon('pen').replace('<svg', '<svg style="width:15px;height:15px;vertical-align:-2px"')} Apple Pencil <span class="hint">(Modus „Stift zeichnet“)</span></h3>
      <table style="border-collapse:collapse;font-size:13.5px;width:100%;margin-bottom:14px">
        ${row('Rechteck zeichnen', 'neuer <b>Schritt</b>')}
        ${row('Raute zeichnen', 'neue <b>Entscheidung</b>')}
        ${row('Oval zeichnen', '<b>Start</b> (bzw. <b>Ende</b>, wenn es schon einen Start gibt)')}
        ${row('Linie Schritt → Schritt', '<b>Verbindung</b> anlegen')}
        ${row('Linie Schritt → leere Fläche', 'neuen Schritt anhängen')}
        ${row('Durchkritzeln', 'Schritt oder Verbindung <b>löschen</b>')}
        ${row('Tippen', 'auswählen – nochmal tippen: <b>Text schreiben</b> (Handschrift wird per Scribble zu Text)')}
        ${row('Halten + ziehen', 'Schritt <b>verschieben</b>')}
      </table>
      <h3 style="margin:0 0 4px;font-size:14px">Finger</h3>
      <table style="border-collapse:collapse;font-size:13.5px;width:100%;margin-bottom:14px">
        ${row('Schritt ziehen', 'verschieben')}
        ${row('Leere Fläche ziehen', 'Ansicht verschieben')}
        ${row('Zwei Finger', 'zoomen und verschieben')}
        ${row('Doppeltippen', 'Text ändern bzw. neuer Schritt')}
        ${row('⊕ am Schritt ziehen', 'Verbindung oder neuen Schritt anlegen')}
        ${row('✕ am Schritt', 'Schritt löschen (mit „Rückgängig“)')}
      </table>
      <h3 style="margin:0 0 4px;font-size:14px">Maus & Tastatur</h3>
      <table style="border-collapse:collapse;font-size:13.5px;width:100%">
        ${row('Doppelklick', 'Text ändern bzw. neuer Schritt')}
        ${row('Mausrad', 'zoomen')}
        ${row('Entf · F2 · Esc', 'löschen · Text bearbeiten · Auswahl aufheben')}
      </table>
      <p class="note" style="margin:14px 0 0">Handballen auf dem Display werden ignoriert, solange der Stift aufliegt. Soll der Stift einfach wie ein Finger schieben, stelle in der Werkzeugleiste auf <b>„Stift schiebt“</b>.</p>`);
  },
  'node-add'(el) {
    const d = curD();
    const from = ui.sel && ui.sel.kind === 'node' ? ui.sel.id : (d.nodes.length ? d.nodes[d.nodes.length - 1].id : null);
    const n = addNode(el.dataset.type, '', { from });
    changed(); renderCanvas(); refreshSteps(); ensureVisible();
    requestAnimationFrame(() => inlineEdit('node', n.id));
  },
  'node-del'(el) { ui.sel = { kind: 'node', id: el.dataset.id }; deleteSelection(); },
  'edge-del'(el) { ui.sel = { kind: 'edge', id: el.dataset.id }; deleteSelection(); },
  'edge-add'(el) {
    const d = curD(), from = el.dataset.id;
    const i = d.nodes.findIndex(n => n.id === from);
    const linked = new Set(d.edges.filter(e => e.from === from).map(e => e.to));
    const cand = [...d.nodes.slice(i + 1), ...d.nodes.slice(0, i)].find(n => n.id !== from && !linked.has(n.id));
    if (!cand) return toast('Lege zuerst einen weiteren Schritt an.');
    const e = addEdge(d, from, cand.id);
    if (!e) return;
    ui.sel = { kind: 'edge', id: e.id };
    relayout(d); changed(); refreshSteps(); renderCanvas();
    const sel = $(`[data-edge-row="${CSS.escape(e.id)}"] select`); sel && sel.focus();
  },
  'qa-add'() {
    const d = curD();
    const type = $('#qa-type').value, label = $('#qa-label').value.trim(), link = $('#qa-link').checked;
    const from = link ? (ui.sel && ui.sel.kind === 'node' && d.nodes.some(n => n.id === ui.sel.id) ? ui.sel.id : (d.nodes.length ? d.nodes[d.nodes.length - 1].id : null)) : null;
    addNode(type, label, { from, link });
    changed(); renderCanvas(); refreshSteps(); ensureVisible();
    $('#qa-label').value = '';
    if (type === 'start' || type === 'end' || type === 'decision') $('#qa-type').value = 'process';
    $('#qa-label').focus();
    scrollStepIntoView();
  },
};

/* =====================================================================
   Globale Events
   ===================================================================== */
function onBind(el) {
  const path = el.dataset.bind;
  let val = el.type === 'checkbox' ? el.checked : el.value;
  setPath(C, path, val);
  const isText = (el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && ['text', 'search', ''].includes(el.type)));
  if (path.startsWith('diagrams.')) {
    const parts = path.split('.');
    const d = C.diagrams[+parts[1]];
    if (parts[2] === 'name') { const tab = $$('.flow-tabs .tab')[+parts[1]]; if (tab) tab.textContent = val || `Diagramm ${+parts[1] + 1}`; }
    if (parts[2] === 'nodes' || parts[2] === 'edges') {
      relayout(d); renderCanvas();
      if (parts[2] === 'nodes' && parts[4] === 'label') {
        const n = d.nodes[+parts[3]];
        $$(`#steps option[value="${CSS.escape(n.id)}"]`).forEach(o => { o.textContent = nodeTitle(d, n.id); });
      }
      if (!isText) refreshSteps();
    }
  }
  if (path.startsWith('prompt.')) updatePromptOut();
  if (path.startsWith('features.') && path.endsWith('.priority')) { const s = $('#feature-summary'); if (s) s.innerHTML = featureSummary(); }
  changed({ typing: isText });
}

function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.tagName === 'TEXTAREA') autoGrow(el);
    if (el.dataset && el.dataset.bind && !(el.tagName === 'SELECT' || el.type === 'radio' || el.type === 'checkbox')) onBind(el);
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset && el.dataset.bind && (el.tagName === 'SELECT' || el.type === 'radio' || el.type === 'checkbox')) onBind(el);
  });
  document.addEventListener('focusin', e => {
    const step = e.target.closest && e.target.closest('#steps [data-step]');
    if (!step) return;
    const row = e.target.closest('[data-edge-row]');
    const s = row ? { kind: 'edge', id: row.dataset.edgeRow } : { kind: 'node', id: step.dataset.step };
    if (!ui.sel || ui.sel.id !== s.id) { ui.sel = s; renderCanvas(); }
  });
  document.addEventListener('keydown', e => {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    const inField = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); exportConcept(); return; }
    if (mod && !inField && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && !inField && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
    if (e.target.id === 'qa-label' && e.key === 'Enter') { e.preventDefault(); ACTIONS['qa-add'](); return; }
    if (ui.section === 'flow' && !inField && !$('#modal').open) {
      if ((e.key === 'Delete' || e.key === 'Backspace') && ui.sel) { e.preventDefault(); deleteSelection(); }
      else if (e.key === 'Escape' && ui.sel) { ui.sel = null; renderCanvas(); }
      else if (e.key === 'F2' && ui.sel) { e.preventDefault(); inlineEdit(ui.sel.kind, ui.sel.id); }
    }
  });
  $('#file-input').addEventListener('change', e => { const f = e.target.files[0]; if (f) importFile(f); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  // Drag & Drop einer JSON-Datei auf das Fenster
  window.addEventListener('dragover', e => { if ([...(e.dataTransfer?.types || [])].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => {
    const f = e.dataTransfer?.files?.[0];
    if (f) { e.preventDefault(); if (/\.json$/i.test(f.name) || f.type.includes('json')) importFile(f); else toast('Bitte eine .json-Datei ablegen.'); }
  });
  window.addEventListener('beforeprint', () => { if (!$('#print-root').innerHTML) buildPrint(); });
  window.addEventListener('afterprint', () => { /* Druckansicht bleibt bis zum nächsten Druck erhalten */ });
  window.addEventListener('hashchange', () => {
    const h = readHash();
    if (SECTIONS.some(s => s.id === h) && h !== ui.section) { ui.section = h; renderNav(); renderMain(); }
  });
  window.addEventListener('resize', debounce(() => { if (ui.section === 'flow') applyView(); }, 150));
}

/* =====================================================================
   Start
   ===================================================================== */
function init() {
  $$('i[data-icon]').forEach(i => { i.outerHTML = icon(i.dataset.icon); });
  store = loadStore();
  if (!store.currentId || !store.concepts[store.currentId]) {
    const list = Object.values(store.concepts).sort((a, b) => str(b.updatedAt).localeCompare(str(a.updatedAt)));
    if (list.length) store.currentId = list[0].id;
    else { const c = newConcept(); store.concepts[c.id] = c; store.currentId = c.id; }
  }
  C = store.concepts[store.currentId];
  const h = readHash();
  if (SECTIONS.some(s => s.id === h)) ui.section = h;
  bindGlobal();
  renderAll();
  histReset();
  setSaveState(storageOK ? 'saved' : 'error');
  if (!storageOK) {
    storageWarned = true;
    toast('Eingeschränkte Vorschau: Hier wird nicht automatisch gespeichert. Öffne die Datei im Browser oder über GitHub Pages.', { ms: 9000 });
  }
}

// Schnittstelle für Tests/Erweiterungen
window.Konzeptwerk = { get concept() { return C; }, store: () => store, autoLayout, buildPrint, buildPrompt, conceptMarkdown, toMermaid, diagramSVG, exampleConcept, normalize, switchTo };

init();
})();

</script>
</body>
